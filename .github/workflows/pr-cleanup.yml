name: pr-cleanup
run-name: 清理 PR #${{ github.event.pull_request.number }} 的测试包

# PR 关闭（合并或放弃）时删掉它的预发布 tag，避免 Releases 页面越积越多
on:
  pull_request:
    types: [ closed ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete per-PR prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          gh release delete "$TAG" --repo '${{ github.repository }}' --yes --cleanup-tag 2>&1 || echo "没有 $TAG，跳过"
