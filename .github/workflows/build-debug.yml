name: build-debug

# 列表里一眼看出这是哪个 PR / 哪个分支（旧版直接显示 '2/merge'，看不出是什么）
run-name: debug ${{ github.head_ref || github.ref_name }} @ ${{ github.sha }}

# PR / main（合并结果）/ 手动。只在 PR 和 main 上跑：
# 以前对 push 用了 branches: ['**']，导致「推分支」+「开/更新 PR」同一提交触发两份一样的构建。
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# PR 里回帖需要写权限；fork PR 上这步会被跳过（见 step 的 if）
permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: debug
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # 固定 debug 签名 key（仓库 Secret）。放在 job 级：step 级 env 在 if 里不生效。
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 可选：固定 debug 签名 key。不提供时 runner 每次生成新 key ⇒ 不同次构建之间覆盖安装会签名冲突。
      # 注意：secrets 不能在 steps[*].if 里直接引用（会让整份 workflow 校验失败），要用 env 中转。
      # 缓存 1：Gradle 依赖 + 构建缓存（Flutter 的 Android 构建里最耗时的一段）
      # 命中时 android 侧几乎不用重新下载 AGP/Kotlin/依赖；改代码只重编增量部分。
      # version 必须 ≥ v5：v4 的 action.yml 是 `runs.using: node20`，GitHub 已废弃 Node 20
      # （会在每次运行顶部刷 "Node.js 20 is deprecated … forced to run on Node.js 24"）。
      # v5 是 node24 且输入/输出与 v4 完全一致（纯升级 runtime）；v6 只是迁到 ESM，不必跟。
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 缓存 2：pub 包（flutter_svg / shizuku 等）
      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 固定测试包签名 key。
      # 坑 1：不固定 ⇒ runner 每次生成新 key，覆盖安装报 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      # 坑 2：把 key 写到 ~/.android/debug.keystore **没用** —— 实测 CI 上 AGP 仍用自己生成的那把
      #       （APK 证书指纹 ≠ 放进去的 keystore），所以这里解到 workspace 并用 PR_TEST_KEYSTORE
      #       传给 gradle（见 android/app/build.gradle 的 signingConfigs.prtest）。
      - name: Decode test signing key
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/ci/test.keystore"
          chmod 600 "$GITHUB_WORKSPACE/ci/test.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/ci/test.keystore" -storepass android \
            -alias androiddebugkey | grep -iE "androiddebugkey|SHA-256" || true
          echo "PR_TEST_KEYSTORE=$GITHUB_WORKSPACE/ci/test.keystore" >> "$GITHUB_ENV"

      - name: Warn if debug keystore is not pinned
        if: env.DEBUG_KEYSTORE_B64 == ''
        run: |
          echo "::warning::未配置 DEBUG_KEYSTORE_B64 ⇒ 本次测试包用的是 runner 随机生成的 debug key，"
          echo "::warning::下次构建的包无法覆盖安装（会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE）。"

      - run: flutter pub get --no-precompile

      # 测试包用 release 构建（AOT）而不是 debug：
      #   实测体积 app-debug.apk 157MB（artifact 71MB） vs app-release.apk 19MB ⇒ 省 3.7 倍
      # PR_TEST_BUILD=1 让 gradle 给 release 版本追加 applicationIdSuffix ".debug"；
      # CI 上没有 key.properties ⇒ 签名落到 debug keystore，可与正式版共存。
      # 离线符号表按当前 KSU LKM 的 UND 清单裁剪（全量源存档在 assets/symtab_src/）
      - name: Build offline symbol tables
        run: bash scripts/build_symtabs.sh

      - name: Build test APK (arm64)
        env:
          PR_TEST_BUILD: '1'
        run: |
          # 版本号从 pubspec 取，避免 gradle 与 pubspec 不一致
          ver=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml | head -1)
          bn=$(sed -n 's/^version: *[0-9.]*+\([0-9]*\).*/\1/p' pubspec.yaml | head -1)
          flutter build apk --release --target-platform android-arm64 --no-pub \
            --build-name "$ver" --build-number "$bn"

      # 产物名带版本 + PR 号，手机上看得懂是哪个包
      - name: Package artifact
        id: pack
        run: |
          VER=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml | head -1)
          # 一律带提交短哈希：PR 包以前只写 pr4，多次提交后分不清装的是哪一版
          # （实测踩过：手机上是旧包，拿着新代码的结论去解释旧包的行为）
          SHA7=$(echo '${{ github.sha }}' | cut -c1-7)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SUF="pr${{ github.event.pull_request.number }}-${SHA7}"
          else
            SUF="$(echo '${{ github.ref_name }}' | tr '/' '-')-${SHA7}"
          fi
          NAME="RootKit-v${VER}-${SUF}-test"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/${NAME}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "out/${NAME}.apk" > /tmp/badging.txt
          # 注意：不要用 sed "s/.*name='\([^']*\)'.*/\1/"，贪婪匹配会命中行尾的
          # compileSdkVersionCodename='14' ⇒ 包名被解析成 "14"。用 dump packagename 最稳。
          PKG=$("$BT/aapt2" dump packagename "out/${NAME}.apk" | tr -d '\r')
          VN=$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" /tmp/badging.txt | head -1)
          VC=$(sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" /tmp/badging.txt | head -1)
          MD5=$(md5sum "out/${NAME}.apk" | cut -d' ' -f1)
          echo "${MD5}  ${NAME}.apk" > "out/${NAME}.apk.md5"
          # 签名证书指纹：跨次构建应完全一致（debug key 固定后）
          CERT=$("$BT/apksigner" verify --print-certs "out/${NAME}.apk" 2>/dev/null \
                   | sed -n "s/^Signer #1 certificate SHA-256 digest: //p" | head -1)
          echo "CERT=$CERT" >> "$GITHUB_ENV"
          SIZE=$(du -h "out/${NAME}.apk" | cut -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          {
            echo "### 测试包：${NAME}.apk"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 包名 | \`${PKG}\` |"
            echo "| versionName | \`${VN}\` |"
            echo "| versionCode | \`${VC}\` |"
            echo "| 大小 | ${SIZE} |"
            echo "| 签名 | debug key（**不能**覆盖正式版，可与正式版共存） |"
            echo "| 构建 | release / AOT（与正式版同构，非 JIT debug 包） |"
            echo "| 签名证书 SHA-256 | \`${CERT:-未知}\` |"
            echo "| md5 | \`${MD5}\` |"
            echo ""
            echo "下载：本页底部 **Artifacts → ${NAME}**（GitHub 强制打包成 zip，解压即为 apk）。"
            echo ""
            echo "安装："
            echo '```'
            echo "unzip ${NAME}.zip && adb install -r ${NAME}.apk"
            echo '```'
            echo ""
            echo "注意：这个包是 \`${PKG}\`，**和正式版 \`com.noworld.rootkit\` 是两个 App**，桌面图标可能同名，别装错。"
            echo ""
            echo "Artifacts 直达：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/*
          retention-days: 14
          # 没匹配到文件时必须失败：默认只 warn，会静默产出"没有 Artifacts"的运行
          if-no-files-found: error
