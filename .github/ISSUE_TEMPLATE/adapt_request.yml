name: 适配申请 · 新机型 / 新内核
description: 请求支持其它荣耀机型或其它内核镜像
title: '[适配] '
labels: ['adaptation']
body:
  - type: markdown
    attributes:
      value: |
        ### 先说清楚：能不能适配，取决于「内核镜像」而不是机型名

        本工具的所有地址/偏移都按**一台机器的内核镜像**标定，一共 5 项：

        | 项 | 来源 |
        |---|---|
        | 物理加载基址 `physBase` | **boot.img** 解出的 kernel（`init_boot.img` 只有 ramdisk，不含内核） |
        | `selinux_state` 偏移 | 内核符号表（有 kallsyms / BTF 更好） |
        | `module_layout` CRC | 内核的 `__versions` 或 vendor 模块里的 modinfo |
        | 模块 vermagic | `uname -r` 整串 |
        | 离线符号表（⑥ 用） | 内核 kallsyms |

        所以：**同一机型 OTA 换了内核构建号 = 新内核**，也要重做标定。
        README §6 有逐步做法；如果你能提供材料，适配可以很快。

  - type: input
    id: model
    attributes:
      label: 机型 / 型号
      placeholder: 例如 荣耀 Magic9（MLY-AN00）
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: 系统版本 + 安全补丁日期
      placeholder: 例如 MagicOS 11.0.0.110 / ASB 2026-09-01
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: 完整内核版本
      description: '`uname -r`（要整串，含 `-abogki…` 后缀）'
      placeholder: 6.12.58-android16-6-g3a7ac1674240-abogki541502914-4k
    validations:
      required: true

  - type: textarea
    id: iomem
    attributes:
      label: /proc/iomem 前 40 行（可选，但很有用）
      description: |
        ```
        adb shell cat /proc/iomem | head -40
        ```
        用来看 System RAM / Kernel code 的物理区间，帮助反推 `physBase`。
    validations:
      required: false

  - type: dropdown
    id: boot
    attributes:
      label: 能否提供 boot.img（提取出的 kernel，或整包）
      options:
        - 可以
        - 只有完整卡刷/OTA 包，需要我自己解
        - 拿不到
        - 不知道怎么做
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: 现在的状态
      options:
        - '环境检查被拦（提示未知内核）'
        - '能跑，但 ① 之后全失败'
        - '直接崩溃 / 重启'
        - '还没装，先问能不能适配'
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我知道「6.12.58 一样」不代表能直接用，需要重做 5 项标定
          required: true
        - label: 我愿意做测试（刷模块/重启/抓日志），我的设备是我自己的
          required: true
