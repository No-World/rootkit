plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// release 签名来源（优先级）：环境变量(CI) > android/key.properties(本地) > debug
//  CI 用：KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
//  本地用：android/key.properties（storeFile 为相对 android/ 的路径）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveStoreFile = {
    def envPath = System.getenv("KEYSTORE_PATH")
    if (envPath) return rootProject.file(envPath)
    def p = keystoreProperties['storeFile']
    return p ? rootProject.file(p) : null
}
def storeFileResolved = resolveStoreFile()
def hasSigning = storeFileResolved != null && storeFileResolved.exists()
def signStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
def signKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
def signKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']

android {
    namespace = "com.noworld.rootkit"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Java 17：AGP 8.x 本身就跑在 17 上，模板里的 1_8 会在编译时刷两条
    // "source value 8 is obsolete / target value 8 is obsolete" 的 javac 警告。
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.noworld.rootkit"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // PR/CI 测试包专用签名：keystore 由 CI 以**绝对路径**注入（PR_TEST_KEYSTORE）。
        // 坑：把 key 放到 ~/.android/debug.keystore 不管用 —— 实测 CI 上 AGP 仍用自己生成的
        // 那把 key（APK 证书指纹 ≠ 放进去的 keystore），所以这里显式指定路径。
        if (System.getenv("PR_TEST_KEYSTORE")) {
            prtest {
                storeFile = file(System.getenv("PR_TEST_KEYSTORE"))
                storePassword = System.getenv("PR_TEST_STORE_PASS") ?: "android"
                keyAlias = System.getenv("PR_TEST_KEY_ALIAS") ?: "androiddebugkey"
                keyPassword = System.getenv("PR_TEST_KEY_PASS") ?: "android"
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
        release {
            if (hasSigning) {
                keyAlias = signKeyAlias
                keyPassword = signKeyPassword
                storeFile = storeFileResolved
                storePassword = signStorePassword
                // 同时启用 v2/v3 签名方案
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // debug 用系统 debug key，无需任何 secrets，便于 PR 测试
            debuggable true
        }
        release {
            // PR / CI 测试包：复用 release 构建（AOT，体积≈正式版 19MB，debug 版 157MB ⇒ 3.7×）
            // 但换包名 .debug + 版本后缀，且 CI 上没有 key.properties ⇒ 落到 debug 签名，可与正式版共存。
            // 由 build-debug.yml 传 PR_TEST_BUILD=1 打开；本地正常打包不受影响。
            if (System.getenv("PR_TEST_BUILD") == "1") {
                applicationIdSuffix ".debug"
                versionNameSuffix "-prtest"
            }
            // 有 key.properties 就用自建 release 签名，否则退回 debug（仅本地调试用）
            signingConfig = hasSigning ? signingConfigs.release : signingConfigs.debug
            // CI 测试包：显式用注入的固定 key（优先级最高）
            if (System.getenv("PR_TEST_KEYSTORE")) {
                signingConfig = signingConfigs.prtest
            }
            // 保留 Flutter 默认：不额外开启 R8（避免与 shrinkResources 冲突）

        }
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "dev.rikka.shizuku:aidl:13.1.5"
}

flutter {
    source = "../.."
}
