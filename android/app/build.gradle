plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// release 签名来源（优先级）：环境变量(CI) > android/key.properties(本地) > debug
//  CI 用：KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
//  本地用：android/key.properties（storeFile 为相对 android/ 的路径）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveStoreFile = {
    def envPath = System.getenv("KEYSTORE_PATH")
    if (envPath) return rootProject.file(envPath)
    def p = keystoreProperties['storeFile']
    return p ? rootProject.file(p) : null
}
def storeFileResolved = resolveStoreFile()
def hasSigning = storeFileResolved != null && storeFileResolved.exists()
def signStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
def signKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
def signKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']

android {
    namespace = "com.noworld.rootkit"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.noworld.rootkit"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasSigning) {
                keyAlias = signKeyAlias
                keyPassword = signKeyPassword
                storeFile = storeFileResolved
                storePassword = signStorePassword
                // 同时启用 v2/v3 签名方案
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // debug 用系统 debug key，无需任何 secrets，便于 PR 测试
            debuggable true
        }
        release {
            // 有 key.properties 就用自建 release 签名，否则退回 debug（仅本地调试用）
            signingConfig = hasSigning ? signingConfigs.release : signingConfigs.debug
            // 保留 Flutter 默认：不额外开启 R8（避免与 shrinkResources 冲突）

        }
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "dev.rikka.shizuku:aidl:13.1.5"
}

flutter {
    source = "../.."
}
